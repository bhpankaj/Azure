# Target servers for the Java scan.
#
# Add one host per line. The SSH password is NOT stored here: it is prompted
# once at runtime and reused for every host in this group.
#
#   server-a ansible_host=20.0.0.4
#   server-b ansible_host=20.0.0.5 ansible_user=azureadmin
#
# The left-hand name becomes the per-host folder name under javaScanReport/,
# so keep it filesystem-safe (use a short alias plus ansible_host= for IPs).

[java_scan]
# server-a ansible_host=20.0.0.4
# server-b ansible_host=20.0.0.5

[java_scan:vars]
ansible_connection=ssh
ansible_port=22
